name: ML Pipeline

on:
  push:
    branches:
      - main

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Install Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install dvc[s3]
        pip install pandas scikit-learn numpy flask

    - name: Configure AWS Credentials
      run: |
        aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY }}
        aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_KEY }}
        aws configure set default.region ap-south-1

    - name: Pull Dataset from DVC
      run: dvc pull

    - name: Train Model
      run: python src/train.py

    - name: Write GitHub Actions Summary
      run: |
        METRICS=$(cat metrics/metrics.json)
        RMSE=$(echo $METRICS | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['rmse'])")
        R2=$(echo $METRICS | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['r2'])")
        SIZE=$(echo $METRICS | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['dataset_size'])")
        echo "## ML Pipeline Results - 2022BCS0076" >> $GITHUB_STEP_SUMMARY
        echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
        echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
        echo "| Dataset Size (training samples) | $SIZE |" >> $GITHUB_STEP_SUMMARY
        echo "| RMSE | $RMSE |" >> $GITHUB_STEP_SUMMARY
        echo "| R² Score | $R2 |" >> $GITHUB_STEP_SUMMARY

    - name: Upload Metrics Artifact
      uses: actions/upload-artifact@v3
      with:
        name: metrics
        path: metrics/metrics.json

    - name: Check if Model is Better and Push to Docker Hub
      run: |
        RMSE=$(cat metrics/metrics.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['rmse'])")
        THRESHOLD=100000
        if (( $(echo "$RMSE < $THRESHOLD" | bc -l) )); then
          echo "Model is good. Pushing to Docker Hub..."
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker build -t ${{ secrets.DOCKER_USERNAME }}/california-housing:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/california-housing:latest
        else
          echo "Model RMSE too high. Skipping Docker push."
        fi